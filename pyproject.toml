
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-visualizer"
version = "0.1.0"
description = "TCP port scanner with a Flask REST API"
requires-python = ">=3.12"
dependencies = [
    "Flask",
]

[tool.setuptools.packages.find]
where = ["."]
